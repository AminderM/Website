<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1d4ed8" />

    <!-- Fallback meta (overridden per-page by react-helmet-async) -->
    <meta name="description" content="Integra AI is an AI-powered Transportation Management System for freight brokers, fleet owners, and dispatchers. Cut costs 50%, save 80% admin time." />

    <!-- Open Graph defaults -->
    <meta property="og:site_name" content="Integra AI" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://integratedtech.ca/og-image.png" />
    <meta property="og:locale" content="en_CA" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Fallback title (overridden per-page by react-helmet-async) -->
    <title>Integra AI | AI-Powered TMS for Logistics</title>

    <!-- Organization + WebSite JSON-LD (site-wide) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://integratedtech.ca/#organization",
          "name": "Integra AI",
          "legalName": "Integrated Supply Chain Solutions",
          "url": "https://integratedtech.ca",
          "logo": { "@type": "ImageObject", "url": "https://integratedtech.ca/logo512.png" },
          "description": "AI-powered Transportation Management System for freight brokers, fleet owners, and dispatchers.",
          "foundingDate": "2024-07",
          "address": { "@type": "PostalAddress", "addressCountry": "CA" },
          "contactPoint": { "@type": "ContactPoint", "contactType": "sales", "url": "https://integratedtech.ca/contact" },
          "sameAs": []
        },
        {
          "@type": "WebSite",
          "@id": "https://integratedtech.ca/#website",
          "url": "https://integratedtech.ca",
          "name": "Integra AI",
          "publisher": { "@id": "https://integratedtech.ca/#organization" }
        }
      ]
    }
    </script>

    <!-- Analytics (existing) -->
    <script
      src="%REACT_APP_BACKEND_URL%/api/site/analytics-tracker.js"
      data-api-url="%REACT_APP_BACKEND_URL%/api/customer-analytics"
      data-analytics-auto-init>
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
